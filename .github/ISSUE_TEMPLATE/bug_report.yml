name: Bug report
description: Report a reproducible problem with TunnelBar.
body:
  - type: markdown
    attributes:
      value: "For security issues, follow SECURITY.md. Redact emails, private URLs, login links, and credentials."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS version, Mac architecture, TunnelBar version/commit, and cloudflared version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic emails and a disposable service where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
