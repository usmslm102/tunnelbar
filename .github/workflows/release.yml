name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, plistlib, re
          tag = os.environ['RELEASE_TAG']
          version = plistlib.loads(open('Resources/Info.plist', 'rb').read())['CFBundleShortVersionString']
          if not re.fullmatch(r'v' + re.escape(version) + r'(?:-[0-9A-Za-z.-]+)?', tag):
              raise SystemExit('Tag must match the app version, optionally with a prerelease suffix')
          PY
      - name: Test
        run: ./scripts/test.sh
      - name: Package Universal 2 app and site
        run: TUNNELBAR_ARCH=universal ./scripts/build-site.sh
      - name: Verify distribution
        run: |
          codesign --verify --deep --strict dist/TunnelBar.app
          lipo dist/TunnelBar.app/Contents/MacOS/TunnelBar -verify_arch arm64 x86_64
          lipo dist/TunnelBar.app/Contents/MacOS/TunnelGuardian -verify_arch arm64 x86_64
          plutil -lint dist/TunnelBar.app/Contents/Info.plist
          cd dist/site/downloads
          shasum -a 256 -c TunnelBar-macOS-universal.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "TunnelBar $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md \
            "${args[@]}" dist/site/downloads/TunnelBar-macOS-universal.zip \
            dist/site/downloads/TunnelBar-macOS-universal.zip.sha256 \
            dist/site/downloads/LICENSE.txt
