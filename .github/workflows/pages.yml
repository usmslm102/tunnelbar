name: Static site

on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build-site.sh', 'scripts/check-site.py', '.github/workflows/pages.yml']
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Select published release (including previews)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$(gh api "repos/$GH_REPO/releases" --jq '[.[] | select(.draft == false)][0].tag_name // empty')"
          if [[ -z "$tag" ]]; then
            echo 'No published release yet; deployment will follow the first release.'
            exit 0
          fi
          mkdir -p release-downloads
          gh release download "$tag" --dir release-downloads --pattern 'TunnelBar-macOS-universal.zip*'
          (cd release-downloads && sha256sum -c TunnelBar-macOS-universal.zip.sha256)
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Assemble site with published download
        if: steps.release.outputs.ready == 'true'
        run: TUNNELBAR_DOWNLOAD_ARCHIVE="$PWD/release-downloads/TunnelBar-macOS-universal.zip" ./scripts/build-site.sh
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.release.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.release.outputs.ready == 'true'
        with:
          path: dist/site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
