name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: swift --version
      - name: Check supporting files
        run: |
          bash -n scripts/build-app.sh scripts/build-site.sh scripts/test.sh
          python3 -c 'import ast; from pathlib import Path; ast.parse(Path("scripts/smoke-test.py").read_text())'
          plutil -lint Resources/Info.plist
          git diff --check
      - name: Test
        run: |
          swift test
          bin_path="$(swift build --show-bin-path)"
          python3 Tests/ProcessLifecycleTests/test_guardian.py "$bin_path/TunnelGuardian"
      - name: Build app and static site
        run: TUNNELBAR_ARCH=universal ./scripts/build-site.sh
      - name: Verify and archive app
        run: |
          codesign --verify --deep --strict --verbose=2 dist/TunnelBar.app
          lipo dist/TunnelBar.app/Contents/MacOS/TunnelBar -verify_arch arm64 x86_64
          lipo dist/TunnelBar.app/Contents/MacOS/TunnelGuardian -verify_arch arm64 x86_64
          plutil -lint dist/TunnelBar.app/Contents/Info.plist
          ditto -c -k --sequesterRsrc --keepParent dist/TunnelBar.app dist/TunnelBar-universal.zip
          ditto -c -k --keepParent dist/site dist/TunnelBar-site-universal.zip
      - name: Upload development build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TunnelBar-universal
          path: |
            dist/TunnelBar-universal.zip
            dist/TunnelBar-site-universal.zip
          if-no-files-found: error
          retention-days: 7
